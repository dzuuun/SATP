<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SATP | Page Not Found</title>
  <link rel="icon" type="image/x-icon" href="../images/NDMU-Logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col bg-gray-50 font-sans antialiased overflow-hidden">

  <nav class="bg-green-800 text-white shadow-md shrink-0">
    <div class="max-w-7xl mx-auto flex justify-between items-center px-6 py-3">
      <div class="flex items-center gap-3">
        <img src="../images/NDMU-Logo.png" alt="Logo" class="w-8 h-8" />
        <span class="font-semibold tracking-wide">Notre Dame of Marbel University</span>
      </div>
      <span class="hidden md:block text-sm opacity-80 text-nowrap">
        Student Assessment of Teacher's Performance
      </span>
    </div>
  </nav>

  <main class="flex-1 flex items-center justify-center p-6">
    <div class="text-center relative max-w-lg w-full">
      
      <div class="mb-8 flex justify-center">
        <div class="p-6 bg-red-100 rounded-full flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 text-red-600">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
        </div>
      </div>

      <div class="relative mb-8 flex justify-center items-center h-32">
        <span class="absolute text-[10rem] font-black text-gray-200 tracking-tighter leading-none select-none opacity-60" aria-hidden="true">
          404
        </span>
        <h1 class="relative z-10 text-4xl font-extrabold text-gray-900 tracking-tight pt-10">
          Page Not Found
        </h1>
      </div>
      
      <p class="text-gray-500 max-w-xs mx-auto mb-10 leading-relaxed px-4">
        Oops! The page you’re looking for doesn’t exist or has been moved to another department.
      </p>

      <button 
        onclick="window.location.href='/'"
        class="inline-flex items-center gap-2.5 bg-green-800 text-white font-semibold px-8 py-3 rounded-full hover:bg-green-900 active:scale-95 transition-all shadow-lg shadow-green-900/20"
      >
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
        Go Back Home
      </button>

    </div>
  </main>

  <footer class="bg-green-800 text-white text-center py-3 text-sm shrink-0">
    NDMU © <span id="year"></span> | Developed by MIS Department
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>

</html>
