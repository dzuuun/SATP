<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SATP | Transaction Management</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://unpkg.com/gridjs/dist/theme/mermaid.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-gray-100 font-sans text-gray-900">

    <div id="overlay">
        <div class="flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-green-700"></div>
            <p class="mt-4 font-semibold text-green-800 text-sm">Loading Data...</p>
        </div>
    </div>

    <div id="mySidenav" class="bg-green-800 sidenav shadow-2xl text-white">
        <a href="javascript:void(0)" class="absolute top-5 right-5 text-3xl" onclick="toggleNav()">&times;</a>
        <div class="px-8 mb-10">
            <img src="../images/NDMU-Logo.png" alt="NDMU" class="w-16 h-16 mx-auto mb-4 bg-white rounded-full p-2">
            <p class="text-center font-bold tracking-widest text-sm uppercase text-green-100">
                <span id="sidebarUserName">Loading...</span>
            </p>
        </div>
        <nav class="space-y-2">
            <a href="dashboard.html" class="flex items-center px-8 py-4 hover:bg-green-700 transition">
                <i class="bi bi-speedometer2 me-3"></i> Dashboard
            </a>
            <a href="index.html" class="flex items-center px-8 py-4 bg-green-800 border-l-4 border-yellow-400">
                <i class="bi bi-file-earmark-text me-3"></i> Transactions
            </a>
            <button id="signout" class="w-full flex items-center px-8 py-4 hover:bg-red-700 transition text-left mt-20">
                <i class="bi bi-box-arrow-left me-3"></i> Sign Out
            </button>
        </nav>
    </div>

    <div id="main" class="transition-all duration-500 flex flex-col flex-grow">

        <header class="bg-green-800 text-white p-4 flex justify-between items-center sticky top-0 z-50 shadow-md">
            <div class="flex items-center">
                <button onclick="toggleNav()" class="text-2xl mr-4 hover:text-yellow-400">
                    <i class="bi bi-list"></i>
                </button>
                <img src="../images/NDMU-Logo.png" class="h-8 mr-3">
                <h1 class="font-bold text-sm md:text-base">Notre Dame of Marbel University</h1>
            </div>
            <div class="text-right hidden md:block">
                <p class=" font-bold text-sm md:text-base"> Student Assessment of Teacher's Performance</p>
            </div>
        </header>

        <div class="p-6 md:p-10 max-w-7xl mx-auto w-full flex-grow">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                <div
                    class="bg-white p-6 rounded-3xl shadow-sm border-l-8 border-gray-300 relative overflow-hidden group hover:shadow-lg transition">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">Total Transactions</p>
                    <h2 id="totalTransactions" class="text-4xl font-black text-gray-800">0</h2>
                    <i class="bi bi-collection absolute -right-2 -bottom-2 text-6xl opacity-5"></i>
                </div>
                <div
                    class="bg-white p-6 rounded-3xl shadow-sm border-l-8 border-green-600 relative overflow-hidden group hover:shadow-lg transition">
                    <p class="text-xs font-bold text-green-700 uppercase tracking-widest mb-1">Accomplished</p>
                    <h2 id="TransactionsAccomplished" class="text-4xl font-black text-green-700">0</h2>
                    <i class="bi bi-check-circle absolute -right-2 -bottom-2 text-6xl opacity-5"></i>
                </div>
                <div
                    class="bg-white p-6 rounded-3xl shadow-sm border-l-8 border-red-500 relative overflow-hidden group hover:shadow-lg transition">
                    <p class="text-xs font-bold text-red-500 uppercase tracking-widest mb-1">To Accomplish</p>
                    <h2 id="transactionsToAccomplish" class="text-4xl font-black text-red-500">0</h2>
                    <i class="bi bi-exclamation-triangle absolute -right-2 -bottom-2 text-6xl opacity-5"></i>
                </div>
            </div>

            <div class="bg-white p-8 rounded-[2rem] shadow-xl border border-gray-100 mb-10">
                <div id="loaddata" class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">School
                            Year</label>
                        <select id="loadSchoolYear"
                            class="w-full border-2 border-gray-100 p-4 rounded-2xl focus:border-green-600 focus:ring-0 transition outline-none text-sm appearance-none bg-no-repeat bg-[right_1rem_center] bg-[length:1em_1em]">
                            <option value="">Select School Year</option>
                        </select>
                    </div>
                    <div>
                        <label
                            class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Semester</label>
                        <select id="loadSemester"
                            class="w-full border-2 border-gray-100 p-4 rounded-2xl focus:border-green-600 focus:ring-0 transition outline-none text-sm appearance-none bg-no-repeat bg-[right_1rem_center] bg-[length:1em_1em]">
                            <option value="">Select Semester</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-gray-100 mb-10">
                <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                    <h3 class="font-black text-xl text-gray-800">Evaluation Records</h3>
                    <div class="flex gap-2">
                        <button id="refresh"
                            class="hidden px-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold text-xs uppercase hover:bg-gray-200 transition">
                            <i class="bi bi-arrow-clockwise me-2"></i> Refresh
                        </button>
                        <button id="generateList"
                            class="hidden px-6 py-3 bg-green-700 text-white rounded-xl font-bold text-xs uppercase hover:bg-green-800 shadow-lg shadow-green-200 transition">
                            <i class="bi bi-file-earmark-excel me-2"></i> Export Unrated (XLSX)
                        </button>
                    </div>
                </div>
                <div id="table-container"></div>
            </div>
        </div>

        <footer class="bg-green-800 text-white text-center py-4 text-sm border-t border-green-900 w-full mt-auto">
            <p>NDMU © <span id="year">2026</span> | Developed by MIS Department</p>
        </footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.js"></script>
    <script src="https://unpkg.com/gridjs/dist/gridjs.umd.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
